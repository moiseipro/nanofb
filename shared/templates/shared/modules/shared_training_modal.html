{% load i18n %}

<div class="modal fade" id="trainingShareModal" tabindex="-1" role="dialog" aria-labelledby="trainingShareModalLbl" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{% trans "Share training"%}</h5>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-12 create-block">
                        <div class="row">
                            <div class="col-6">
                                {% trans "Link will be available until"%}:
                            </div>
                            <div class="col-6">
                                <input class="form-control form-control-sm" name="date" type="date" value="" autocomplete="off" required="">
                            </div>
                        </div>
                    </div>
                    <div class="col-12 link-block">
                        <div class="row mt-3">
                            <div class="col-2">
                                {% trans "Link"%}:
                            </div>
                            <div class="col-10 link-text">
                                <a href="" target="_blank">-</a>
                            </div>
                            <div class="col-12 link-qrcode d-flex justify-content-center mt-4">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-info btn-share-out" data-link="" data-messanger="vk" title="{% trans 'Send with'%} VK">
                    <i class="fa fa-vk" aria-hidden="true"></i>
                </button>
                <button type="button" class="btn btn-outline-info btn-share-out" data-link="" data-messanger="whatsapp" title="{% trans 'Send with'%} Whatsapp">
                    <i class="fa fa-whatsapp" aria-hidden="true"></i>
                </button>
                <button type="button" class="btn btn-outline-info btn-share-out" data-link="" data-messanger="telegram" title="{% trans 'Send with'%} Telegram">
                    <i class="fa fa-telegram" aria-hidden="true"></i>
                </button>
                <button type="button" class="btn btn-outline-info btn-share-out" data-link="" data-messanger="sms" title="{% trans 'Send with'%} SMS">
                    <i class="fa fa-comments-o" aria-hidden="true"></i>
                </button>
                <button type="button" class="btn btn-outline-info btn-share-out" data-link="" data-messanger="email" title="{% trans 'Send with'%} Email">
                    <i class="fa fa-envelope-o" aria-hidden="true"></i>
                </button>
                <button type="button" class="btn btn-primary btn-share" data-link="">{% trans "Share"%}</button>
                <button type="button" class="btn btn-secondary" data-dismiss="modal">{% trans "Cancel"%}</button>
            </div>
        </div>
    </div>
</div>
